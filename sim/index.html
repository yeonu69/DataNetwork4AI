<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>네트워크 시뮬레이터 모음</title><link rel="stylesheet" href="common.css">
<style>.chap{margin:0 0 14px}.chap h2 a{color:inherit;text-decoration:none}.chap ul{margin:4px 0 0;padding-left:20px}.chap li{margin:3px 0}.chap li a{font-weight:700;color:var(--p)}</style></head><body>
<header><div class="ch">데이터 통신과 컴퓨터 네트워크</div><h1>실습 시뮬레이터 모음</h1></header><main>
<div class="card how">책의 [시뮬레이터로 해 보기] 상자에 나온 시뮬레이터를 장별로 모았습니다. 개념을 글로 읽기 전에 먼저 눌러 보고 움직여 보면 훨씬 빨리 이해됩니다. 휴대폰과 PC 브라우저에서 모두 동작하며 설치할 것은 없습니다. <b id="cnt"></b></div>
<div id="list"></div></main>
<footer>데이터 통신과 컴퓨터 네트워크 · 실습 시뮬레이터</footer>
<script src="list.js"></script><script>
let h="",n=0;for(const ch in SIMS){const c=SIMS[ch],d="ch"+String(ch).padStart(2,"0")+"/";h+=`<div class="card chap"><h2><a href="${d}">${ch}장. ${c.t}</a></h2><ul>`;
c.s.forEach(x=>{n++;h+=`<li><a href="${d}${x[0]=="index.html"?"":x[0]}">${x[1]}</a> <span class="mut">${x[2]}</span></li>`});h+="</ul></div>"}
list.innerHTML=h;cnt.textContent=`지금 ${n}개가 있습니다.`;
</script></body></html>
